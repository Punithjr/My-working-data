    <script>
      // Gracefully handle benign HMR/WebSocket disconnect events in sandbox/iframe environment
      (function() {
        if (typeof window === 'undefined') return;

        // Prevent Vite HMR client from raising unhandled WebSocket closed errors
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          function SafeWebSocket(url, protocols) {
            var isViteHmr = protocols === 'vite-hmr' || 
                            (typeof url === 'string' && (url.indexOf('vite') !== -1 || url.indexOf('run.app') !== -1 || url.indexOf(':3000') !== -1));
            
            if (isViteHmr) {
              var listeners = {};
              var ws = {
                url: url,
                readyState: 1, // OPEN
                protocol: 'vite-hmr',
                extensions: '',
                binaryType: 'blob',
                bufferedAmount: 0,
                send: function() {},
                close: function() {
                  ws.readyState = 3; // CLOSED
                  if (typeof ws.onclose === 'function') {
                    try { ws.onclose({ wasClean: true, code: 1000, reason: 'normal' }); } catch(e) {}
                  }
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(l) { return l !== fn; });
                },
                dispatchEvent: function(event) {
                  var fns = listeners[event.type] || [];
                  for (var i = 0; i < fns.length; i++) {
                    try { fns[i].call(ws, event); } catch(e) {}
                  }
                  return true;
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };

              setTimeout(function() {
                if (ws.readyState === 1) {
                  var evt = { type: 'open', target: ws };
                  if (typeof ws.onopen === 'function') {
                    try { ws.onopen(evt); } catch(e) {}
                  }
                  ws.dispatchEvent(evt);
                }
              }, 30);

              return ws;
            }

            return new NativeWebSocket(url, protocols);
          }

          SafeWebSocket.prototype = NativeWebSocket.prototype;
          SafeWebSocket.CONNECTING = 0;
          SafeWebSocket.OPEN = 1;
          SafeWebSocket.CLOSING = 2;
          SafeWebSocket.CLOSED = 3;

          try {
            window.WebSocket = SafeWebSocket;
          } catch(e) {}
        }

        var isWsErr = function(err, msg, file) {
          var str = (msg || '') + ' ' + (file || '') + ' ' + 
                    (err && err.message ? err.message : '') + ' ' + 
                    (err && err.stack ? err.stack : '') + ' ' + 
                    (err ? String(err) : '');
          return str.indexOf('WebSocket') !== -1 || 
                 str.indexOf('closed without opened') !== -1 || 
                 str.indexOf('@vite/client') !== -1 ||
                 str.indexOf('vite:ws') !== -1;
        };

        var origConsoleError = console.error;
        console.error = function() {
          var str = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            str += ' ' + (arg && arg.message ? arg.message : '') + ' ' + (arg && arg.stack ? arg.stack : '') + ' ' + String(arg);
          }
          if (isWsErr(null, str, '')) {
            return;
          }
          if (origConsoleError) origConsoleError.apply(console, arguments);
        };

        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isWsErr(error, msg, url)) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
        };

        window.addEventListener('error', function(event) {
          if (event && isWsErr(event.error, event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (isWsErr(reason, msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();

      // Capture PWA beforeinstallprompt as early as possible
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
