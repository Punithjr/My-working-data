name: Vite application build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Office data commit guard
        run: |
          node --test scripts/check-office-data-commits.test.cjs
          node scripts/check-office-data-commits.cjs
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite frontend and Node backend
        run: npm run build
