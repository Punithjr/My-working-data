name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**','server/**','server.ts','src/**','package.json','vite.config.ts','.github/workflows/windows-desktop.yml']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check desktop/main.cjs
      - run: node --check desktop/backup.cjs
      - run: node --check desktop/migrate.cjs
      - run: node --test desktop/desktop.test.cjs
      - run: npm run lint
      - run: npm run build
      - run: npx electron-builder install-app-deps
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BEO-Bhadravathi-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
