name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'server/**'
      - 'server.ts'
      - 'src/**'
      - 'package.json'
      - 'hybrid/**'
      - 'vite.config.ts'
      - '.github/workflows/windows-desktop.yml'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Install Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Record Windows and Node diagnostics
        run: |
          node --version
          npm --version
          Get-ComputerInfo | Select-Object WindowsProductName,OsArchitecture
      - name: Install project dependencies
        run: npm install --no-audit --no-fund --foreground-scripts
      - name: Validate desktop JavaScript syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/backup.cjs
          node --check desktop/migrate.cjs
          node --check desktop/desktop.test.cjs
      - name: Test migration and backup/restore without real office data
        run: node --test desktop/desktop.test.cjs
      - name: Test hybrid local-only bridge with synthetic data
        run: node --test hybrid/office-bridge.test.cjs
      - name: Check TypeScript
        run: npm run lint
      - name: Build production frontend and backend
        run: npm run build
      - name: Verify packaged backend and frontend exist
        run: |
          if (!(Test-Path 'dist/server.cjs')) { throw 'Missing dist/server.cjs' }
          if (!(Test-Path 'dist/index.html')) { throw 'Missing dist/index.html' }
      - name: Rebuild native SQLite for Electron
        run: npx electron-builder install-app-deps
      - name: Verify rebuilt SQLite binary before packaging
        run: |
          $sqliteRoot = 'node_modules/better-sqlite3'
          if (!(Test-Path $sqliteRoot)) { throw 'better-sqlite3 package missing after rebuild' }
          $native = @(Get-ChildItem -Path $sqliteRoot -Filter 'better_sqlite3.node' -Recurse -File -ErrorAction SilentlyContinue)
          if ($native.Count -eq 0) {
            Write-Host 'Electron rebuild returned without a native binary; retrying from source'
            Push-Location $sqliteRoot
            try { npx --no-install node-gyp rebuild --release --verbose; if ($LASTEXITCODE -ne 0) { throw 'node-gyp rebuild failed' } } finally { Pop-Location }
            $native = @(Get-ChildItem -Path $sqliteRoot -Filter 'better_sqlite3.node' -Recurse -File -ErrorAction SilentlyContinue)
          }
          if ($native.Count -eq 0) { throw 'SQLite native binary still missing after source rebuild' }
          $native | Select-Object FullName,Length | Format-Table
      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --publish never
      - name: Verify packaged backend, web assets and native SQLite module
        run: |
          $appDir = 'release/win-unpacked'
          if (!(Test-Path $appDir)) { throw 'Missing unpacked Windows application' }
          $resources = Join-Path $appDir 'resources'
          if (!(Test-Path (Join-Path $resources 'backend/server.cjs'))) { throw 'Backend missing from Windows package' }
          if (!(Test-Path (Join-Path $resources 'web/index.html'))) { throw 'Frontend missing from Windows package' }
          $sqliteRoot = Join-Path $resources 'backend/node_modules/better-sqlite3'
          if (!(Test-Path $sqliteRoot)) { throw 'better-sqlite3 package missing beside packaged backend' }
          $sqlite = @(Get-ChildItem -Path $sqliteRoot -Filter 'better_sqlite3.node' -Recurse -File -ErrorAction SilentlyContinue)
          if ($sqlite.Count -eq 0) { throw 'Native better_sqlite3.node missing beside packaged backend' }
          $sqlite | Select-Object FullName,Length | Format-Table
      - name: Verify Windows application executable
        run: |
          $executables = @(Get-ChildItem -Path 'release/win-unpacked' -Filter '*.exe' -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch '^(elevate|uninstall)' })
          if ($executables.Count -eq 0) { throw 'No packaged Windows application executable found' }
          $executables | Select-Object Name,Length | Format-Table
      - name: Verify installer output
        run: |
          $installers = @(Get-ChildItem -Path 'release' -Filter '*.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) { throw 'No Windows .exe installer produced' }
          $installers | Select-Object Name,Length | Format-Table
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: BEO-Bhadravathi-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
      - name: Publish build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Windows-build-diagnostics
          path: |
            release/builder-debug.yml
            release/builder-effective-config.yaml
          if-no-files-found: ignore
